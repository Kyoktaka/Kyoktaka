name: Generate Git Koi

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install git-koi from source
        run: cargo install --git https://github.com/yalongwastaken/git-koi --locked

      - name: Generate Koi
        run: |
          # run the generator command here using your repo owner / output path
          # Example: git-koi --username "${{ github.repository_owner }}" --output ./git-koi.gif

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update git-koi GIF" || exit 0
          git push
