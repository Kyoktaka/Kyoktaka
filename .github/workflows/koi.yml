name: Generate Git Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/koi.yml"

permissions:
  contents: write

concurrency:
  group: koi
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Koi animation
        uses: yalongwastaken/git-koi@v1
        with:
          login: ${{ github.repository_owner }}
          body: white
          output-dir: koi

      - name: Commit updated Koi GIF
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "Koi GIF is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Git Koi animation [skip ci]"
          git push
